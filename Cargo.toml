[package]
name = "ok-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.1" }
clap = { version = "4.5.30", features = ["derive"] }
derive_more = { version = "2.0.1", features = ["full"] }
serde = "1.0.218"
tokio = { version = "1.43.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
