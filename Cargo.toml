[package]
name = "ok-rs"
version = "0.1.1"
edition = "2024"

[dependencies]
axum = { version = "0.8.7" }
clap = { version = "4.5.53", features = ["derive"] }
serde = "1.0.228"
tokio = { version = "1.48.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.7", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
